[coverage:run]
source = src
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    */setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
sort = cover

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

[flake8]
max-line-length = 127
max-complexity = 10
extend-ignore = E203, W503
exclude = .git,__pycache__,build,dist,venv,env,.tox,htmlcov
per-file-ignores =
    __init__.py:F401
    tests/*:S101

[isort]
profile = black
line_length = 127
known_first_party = src,tests
skip = __pycache__,venv,env

[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
# Only ignore imports for packages without type stubs (migrated to pyproject.toml)
ignore_missing_imports = False
exclude = tests/

[pydocstyle]
convention = google
match = (?!test_).*\.py
match-dir = (?!tests).*

[bandit]
skips = B101,B601
exclude_dirs = tests,venv,env

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-fail-under=85
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    performance: Performance tests
    security: Security tests
    slow: Slow tests
    real_api: Tests requiring real API access
    skip_ci: Tests to skip in CI